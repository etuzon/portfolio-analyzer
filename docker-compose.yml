services:
  portfolio-analyzer:
    build: .
    container_name: portfolio-analyzer
    ports:
      - "6443:6443"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./certs:/app/certs
    environment:
      CONFIG_PATH: /app/config.yaml
      DATA_DIR: /app/data
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
    networks:
      - default
      - ghostfolio
    restart: unless-stopped

networks:
  ghostfolio:
    external: true
    name: ghostfolio_default
