services:
  portfolio-analyzer:
    build: .
    container_name: portfolio-analyzer
    ports:
      - "6443:6443"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
      - ./certs:/app/certs
      # Contains only a Unix socket, never Codex credentials or portfolio files.
      - ${PORTFOLIO_CODEX_DIR:-./.runtime/portfolio-codex}:/run/portfolio-codex:ro
    environment:
      CONFIG_PATH: /app/config.yaml
      DATA_DIR: /app/data
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      EODHD_API_KEY: ${EODHD_API_KEY:-}
      SPGLOBAL_RATINGS_TOKEN: ${SPGLOBAL_RATINGS_TOKEN:-}
      PORTFOLIO_ASSISTANT_PROVIDER: ${PORTFOLIO_ASSISTANT_PROVIDER:-}
      PORTFOLIO_CODEX_SOCKET: /run/portfolio-codex/bridge.sock
    networks:
      - default
      - external_import
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "${CONTAINER_LOG_MAX_SIZE:-10m}"
        max-file: "${CONTAINER_LOG_MAX_FILES:-10}"
        compress: "true"

networks:
  external_import:
    external: true
    name: external_import_default
