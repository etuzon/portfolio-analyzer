external_import:
  db:
    host: "portfolio-source-db"
    port: 5432
    database: "portfolio_source"
    username: "portfolio_reader"
    password: "change-me"
    ssl: false

market_data:
  primary: "alpha_vantage"
  fallback: ["financial_modeling_prep", "frankfurter_fx", "external_import_market_data"]
  experimental_fallback: ["nasdaq_quote", "stooq", "sec_company_facts", "yahoo_finance"]
  cache_ttl_hours: 24
  max_cache_mb: 1000
  alpha_vantage:
    api_key: "${ALPHA_VANTAGE_API_KEY}"
  financial_modeling_prep:
    api_key: "${FMP_API_KEY}"
  yahoo_finance:
    enabled: true
  google_finance:
    enabled: false
  # Automatic US bond/fund research; GET /api/security/market-data.
  # These feeds populate the provider cache, never recorded portfolio prices.
  security_lookup:
    cache_ttl_hours: 24
    max_provider_requests: 5
    treasury_direct:
      enabled: true  # Public Treasury reference data and bounded daily prices.
    finnhub:
      enabled: true
      api_key: "${FINNHUB_API_KEY}"  # Bond data requires suitable provider access.
    eodhd:
      enabled: true
      api_key: "${EODHD_API_KEY}"  # US mutual fund/ETF fundamentals and EOD history.

dashboard:
  https_port: 6443
  display_currencies: ["USD", "ILS", "USD/ILS"]
  banner_items:
    - label: "USD/ILS"
      type: "fx"
      symbol: "USD/ILS"
    - label: "EUR/ILS"
      type: "fx"
      symbol: "EUR/ILS"
    - label: "Nasdaq"
      type: "index"
      symbol: "IXIC"
    - label: "Gold"
      type: "commodity"
      symbol: "GCUSD"

alerts:
  schedule: "0 7 * * *"
  timezone: "Asia/Jerusalem"
  notification:
    channels: ["dashboard"]

# Chat can use the locally signed-in Codex CLI without an API key.
# Run ./scripts/start-codex-bridge.sh on the host before starting Docker.
# Alternatively use local_claude (signed-in Claude Code) or an OpenAI-compatible service.
# The model may request only allowlisted GET routes; it never accesses the DB.
llm:
  enabled: true
  provider: "local_codex"
  codex_socket: "/run/portfolio-codex/bridge.sock"
  # Used only by provider: openai. Never sent to browsers or model prompts.
  base_url: "https://api.openai.com/v1"
  api_key: "${LLM_API_KEY}"
  # Empty uses the selected CLI's default; set an explicit model to pin it.
  model: ""
  # none, minimal, low, medium, high, xhigh, or max. Provider/model support varies.
  reasoning_effort: "medium"
  # Hard ceilings per message; values above 5 are capped, including failed calls.
  max_tool_loops: 5
  max_rest_calls: 5
  # Saved user/assistant messages included with the next question; 0 disables context.
  max_context_messages: 12
  timeout_seconds: 30

# Host-side skill runner; independent of the read-only dashboard chat.
# Requires a signed-in CLI, an authorized REST bearer token, and Brave Search.
price_agent:
  provider: "codex"  # codex (default) or claude
  # Empty resolves to gpt-6.1-sol for Codex, sonnet for Claude Code.
  model: ""
  reasoning_effort: "medium"
  max_model_calls: 5
  max_rest_calls: 5
  timeout_seconds: 110
  base_url: "https://localhost:6443"
  search:
    provider: "brave"
    api_key: "${BRAVE_SEARCH_API_KEY}"

dividends:
  enabled: true
  schedule: "15 8 * * *"
  timezone: "Asia/Jerusalem"
  start_date: "2026-08-01"
  tax_rate: 0.25
  lookahead_days: 180

backup:
  enabled: true
  schedule: "45 23 * * *"
  timezone: "Asia/Jerusalem"
  keep: 100
