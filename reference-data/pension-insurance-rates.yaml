metadata:
  name: pension_insurance_rates
  description: Pension insurance cost coefficient table by age, disability coverage, and survivors coverage.
  units: risk coefficients
  calculation:
    core_formula: disability uses divisor 1,000; survivors uses divisor 100,000
    disability:
      description: Loss of earned income insurance.
      salary_replacement_factor: 0.75
      contribution_waiver_factor: 0.20
      total_coverage_factor: 0.95
      formulas:
        male: monthly_disability_cost = ((insured_salary * 0.95) * disability_male) / 1000
        female: monthly_disability_cost = ((insured_salary * 0.95) * disability_female) / 1000
      examples:
        - age: 34
          insured_salary: 10000
          sex: male
          risk_rate_column: disability_male
          risk_rate: 1.94
          net_amount_at_risk: 9500
          monthly_cost: 18.43
        - age: 34
          insured_salary: 10000
          sex: female
          risk_rate_column: disability_female
          risk_rate: 3.12
          net_amount_at_risk: 9500
          monthly_cost: 29.64
    survivors:
      description: Death benefit insurance.
      spouse_coverage_factor: 0.60
      formulas:
        net_capital_at_risk: net_capital_at_risk = max((insured_salary * (spouse_survivors_coverage_percent + children_survivors_coverage_percent) / 100 * actuarial_capitalization_factor) - savings_balance, 0)
        male: monthly_survivors_cost = (net_capital_at_risk * survivors_male) / 100000
        female: monthly_survivors_cost = (net_capital_at_risk * survivors_female) / 100000
      variables:
        savings_balance: Total accumulated pension savings balance. Acts as an offset.
        actuarial_capitalization_factor: Converts monthly spouse pension liability into lump sum. Typically 150-220.
      examples:
        - age: 34
          insured_salary: 10000
          savings_balance: 0
          actuarial_capitalization_factor: 200
          sex: male
          risk_rate_column: survivors_male
          risk_rate: 0.61
          net_capital_at_risk: 1200000
          monthly_cost: 7.32
    total_monthly_insurance_deduction: total_monthly_cost = monthly_disability_cost + monthly_survivors_cost
  columns:
    - age
    - disability_male
    - disability_female
    - survivors_male
    - survivors_female

