report:
  - State verified event facts, cutoff and unresolved evidence first.
  - Compare company and region, transmission channel, evidence and expected lag in a table.
  - Show probability kind, target and conditions, horizon, estimate or unknown, uncertainty and independent sample count.
  - Show stock return, revenue and net income as separate rows with baselines, units, supported ranges and missing reasons.
  - Explain alternative causes, regional differences, dependencies and conditions that would invalidate the thesis.
  - Distinguish historical observations, unvalidated scenarios and validated forecasts; include sources beside claims.
  - State what evidence is needed next and whether any forecast or case artifact was actually saved.

methodology_sources:
  - title: NIST confidence intervals for binomial proportions
    url: https://itl.nist.gov/div898/handbook/prc/section2/prc241.htm
    scope: Wilson intervals for independent binary observations; not a validation of financial forecasting.
